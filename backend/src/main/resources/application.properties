server.port=${PORT:8081}

# Comma-separated list of browser origins allowed to call this API.
# Override via the CORS_ALLOWED_ORIGINS env var in production, e.g.:
#   CORS_ALLOWED_ORIGINS=https://bangla-lang.vercel.app,https://*.vercel.app
# Wildcard patterns are supported (handled by allowedOriginPatterns).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
